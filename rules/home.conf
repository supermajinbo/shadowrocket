# Shadowrocket Home Profile (Optimized)

[General]
ipv6 = true
bypass-system = false

# ✅ 分流 DNS（国外优先 CF，国内走阿里）
dns-server = https://1.1.1.1/dns-query

update-url = https://raw.githubusercontent.com/supermajinbo/shadowrocket/refs/heads/main/rules/home.conf

# ====== 本地域名加速（关键优化）======
[Host]
nas.majinbo.com = 192.168.1.17
home.majinbo.com = 192.168.1.111

[Proxy Group]

# 🔥 核心自动代理（所有节点）
PROXIES = url-test,🇭🇰HK,🇯🇵JP,🇺🇸US,🇸🇬SG,🇨🇳TW,🇰🇷KR,interval=600,tolerance=50,url=http://www.gstatic.com/generate_204

# 🔥 国家分组（用于手动切地区）
🇭🇰HK = url-test,policy-regex-filter=香港,interval=1800
🇯🇵JP = url-test,policy-regex-filter=日本,interval=1800
🇺🇸US = url-test,policy-regex-filter=美国,interval=1800
🇸🇬SG = url-test,policy-regex-filter=(新加坡|狮城),interval=1800
🇨🇳TW = url-test,policy-regex-filter=台湾,interval=1800
🇰🇷KR = url-test,policy-regex-filter=韩国,interval=1800

# 🔥 手动兜底池（防止没有想要的节点）
ALL = select,🇭🇰HK,🇯🇵JP,🇺🇸US,🇸🇬SG,🇨🇳TW,🇰🇷KR

# ====== 流媒体策略（核心优化）======

# ✅ YouTube：默认直连（IPv6省流量）
YOUTUBE = select,DIRECT,🇭🇰HK,🇯🇵JP,🇺🇸US,🇸🇬SG,🇨🇳TW,🇰🇷KR

# ✅ Google：默认直连（IPv6省流量）
GOOGLE = select,DIRECT,🇭🇰HK,🇯🇵JP,🇺🇸US,🇸🇬SG,🇨🇳TW,🇰🇷KR

# ✅ 其他流媒体：默认代理 + 可切地区
NETFLIX = select,PROXIES,🇭🇰HK,🇯🇵JP,🇺🇸US,🇸🇬SG,🇨🇳TW,🇰🇷KR
DISNEY = select,PROXIES,🇭🇰HK,🇯🇵JP,🇺🇸US,🇸🇬SG,🇨🇳TW,🇰🇷KR
TIKTOK = select,PROXIES,🇭🇰HK,🇯🇵JP,🇺🇸US,🇸🇬SG,🇨🇳TW,🇰🇷KR
OPENAI = select,PROXIES,🇭🇰HK,🇯🇵JP,🇺🇸US,🇸🇬SG,🇨🇳TW,🇰🇷KR

# ✅ 苹果服务
APPLE = select,DIRECT,PROXIES

[Rule]

# ====== 本地域名（最高优先级）======
DOMAIN,nas.majinbo.com,DIRECT
DOMAIN,home.majinbo.com,DIRECT

# ====== 局域网 ======
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Lan/Lan.list,DIRECT

# ====== 广告拦截 ======
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list,REJECT
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list,REJECT

# ====== 国内直连 ======
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China.list,DIRECT
GEOIP,CN,DIRECT

# ====== Google 直连 ======
DOMAIN-SUFFIX,google.com,GOOGLE
DOMAIN-SUFFIX,googleapis.com,GOOGLE

# ====== 流媒体 ======
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/YouTube/YouTube.list,YOUTUBE
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Netflix/Netflix.list,NETFLIX
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Disney/Disney.list,DISNEY
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/TikTok/TikTok.list,TIKTOK
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OpenAI/OpenAI.list,OPENAI

# ====== Apple ======
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple.list,APPLE

# ====== IPv6 优先直连（关键）======
IP-CIDR6,::/0,DIRECT

# ====== 默认兜底 ======
FINAL,PROXIES

[URL Rewrite]
^https?://(www\.)?g\.cn https://www.google.com 302
^https?://(www\.)?google\.cn https://www.google.com 302
